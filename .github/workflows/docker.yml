# Teste puis publie les images Docker dans GitHub Container Registry (ghcr.io) :
#   ghcr.io/<propriétaire>/arr411-web       l'application (et le proxy de sortie de la vue C411)
#   ghcr.io/<propriétaire>/arr411-browser   le navigateur de la vue C411
# Si le dépôt a une variable (ou un secret) DOCKERHUB_USERNAME et un secret DOCKERHUB_TOKEN, les mêmes images sont
# aussi publiées sur Docker Hub : <identifiant>/arr411-web et <identifiant>/arr411-browser.
# À placer à la racine d'un dépôt GitHub qui contient ce projet.
name: Images Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Les deux images sont construites à chaque fois (même sur une pull request, sans publication) pour repérer une erreur de Dockerfile.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: arr411-web
            context: .
          - image: arr411-browser
            context: ./browser
    steps:
      - uses: actions/checkout@v4
      - name: Noms des images en minuscules (GHCR, et Docker Hub s'il est configuré)
        run: |
          {
            echo "IMAGES<<END_OF_IMAGES"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then echo "${DOCKERHUB_USERNAME,,}/${{ matrix.image }}"; fi
            echo "END_OF_IMAGES"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
