<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1411">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion · Arr411</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/login/login.css">
</head>
<body>
  <main class="wrap">
    <form id="form" class="card" method="post" action="/login" novalidate>
      <img class="logo" src="/icons/icon-192.png" alt="" width="72" height="72">
      <h1><span>Arr</span>411</h1>
      <p class="sub">Connecte-toi pour accéder à ta médiathèque.</p>
      <div id="err" class="err" role="alert" hidden></div>
      <label for="u">Identifiant</label>
      <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="p">Mot de passe</label>
      <div class="pw">
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <button id="eye" class="eye" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
        </button>
      </div>
      <button id="go" class="go" type="submit">Se connecter</button>
      <p class="foot">Accès réservé aux comptes créés par l’administrateur.</p>
    </form>
  </main>
  <noscript><p class="no-js">Arr411 a besoin de JavaScript pour fonctionner.</p></noscript>
  <script src="/login/login.js"></script>
</body>
</html>
