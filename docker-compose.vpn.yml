# Arr411 Web avec la vue C411 derrière un VPN (gluetun).
# C'est docker-compose.ghcr.yml avec un conteneur de plus, « gluetun » (client VPN, image qmcgaw/gluetun), et le proxy
# « egress » branché dans son réseau : la vue C411 sort donc par le tunnel VPN, et par lui seul (sans tunnel, rien ne sort).
# L'application et tes services (qBittorrent, Radarr, Sonarr, Lidarr) ne passent pas par le VPN.
#
# Rien à cloner. Dans un dossier vide, enregistre ce fichier sous le nom docker-compose.yml, puis :
#
#   1. copie .env.example (à la racine du dépôt du projet) en .env à côté de ce fichier, et remplis sa section « VPN » :
#      fournisseur, clé WireGuard (ou identifiant et mot de passe OpenVPN), pays ;
#   2. docker compose up -d
#   3. docker compose logs gluetun  (cherche « Public IP address is » : l'adresse de ton VPN)
#      docker compose logs arr411   (mot de passe administrateur du premier démarrage)
#
# Mise à jour : docker compose pull && docker compose up -d
# Même nom de projet et même volume que docker-compose.ghcr.yml : tu peux passer de l'un à l'autre sans perdre tes données.
# Si tu publies toi-même les images, remplace « hugomeyer » par ton compte GitHub, en minuscules.
# Images sur Docker Hub plutôt que sur GHCR : remplace « ghcr.io/hugomeyer/ » par « ton-identifiant/ » dans les lignes image: (voir le README).
#
# egress vit dans le réseau de gluetun : si gluetun est redémarré seul, redémarre aussi egress (docker compose restart egress).
#
# C'est le docker-compose.ghcr.yml avec trois changements : un test vérifie qu'ils ne divergent pas.
#   - le service « gluetun » en plus ;
#   - « egress » dans le réseau de gluetun (network_mode), à la place des réseaux default et c411-egress ;
#   - « browser » qui joint le proxy par le nom « gluetun » (EGRESS_PROXY), puisque c'est lui qui porte le réseau.
#
# Avec HTTPS automatique (Caddy) : renseigne DOMAIN, PUBLIC_URL, TRUST_PROXY=1 et BIND_ADDRESS=127.0.0.1 dans .env, puis
#   docker compose --profile https up -d
name: arr411

services:
  arr411:
    image: ghcr.io/hugomeyer/arr411-web:latest
    container_name: arr411
    restart: unless-stopped
    # BIND_ADDRESS=127.0.0.1 : le port n'est joignable que depuis cette machine (derrière un reverse proxy, Caddy compris).
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3131}:3000"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      INSECURE_UPSTREAM_TLS: ${INSECURE_UPSTREAM_TLS:-false}
      ALLOW_SEARCH_COMMANDS: ${ALLOW_SEARCH_COMMANDS:-false}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      C411_BROWSER_URL: ${C411_BROWSER_URL-http://browser:9223}
      C411_MAX_SESSIONS: ${C411_MAX_SESSIONS:-3}
      C411_IDLE_MINUTES: ${C411_IDLE_MINUTES:-15}
      C411_PERSIST_COOKIES: ${C411_PERSIST_COOKIES:-true}
      C411_ALLOWED_HOSTS: ${C411_ALLOWED_HOSTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - arr411-data:/data
    networks:
      - default
      - c411-control
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Chromium sur un écran virtuel, piloté par arr411 (DevTools, sans authentification : jamais de port publié).
  # Aucune route directe vers Internet : il ne parle qu'à arr411 (qui le pilote) et au proxy « egress ». Aucun secret.
  # Le proxy est joint par le nom « gluetun » : egress est dans le réseau de ce conteneur.
  browser:
    image: ghcr.io/hugomeyer/arr411-browser:latest
    container_name: arr411-browser
    restart: unless-stopped
    environment:
      EGRESS_PROXY: http://gluetun:3128
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-0}
      TZ: ${TZ:-Europe/Paris}
    networks:
      - c411-control
      - c411-egress
    depends_on:
      egress:
        condition: service_healthy
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 2048

  # Seule sortie du navigateur : tunnels HTTPS (port 443) vers c411.org et la vérification Cloudflare, rien d'autre.
  # Même image que arr411, mais sans volume ni secret.
  # Il partage le réseau de gluetun (network_mode) : ses connexions et ses requêtes DNS passent par le tunnel VPN.
  # Un conteneur dans le réseau d'un autre n'a ni « networks », ni « ports » ; le nom « egress » ne se résout plus, il faut dire « gluetun ».
  egress:
    image: ghcr.io/hugomeyer/arr411-web:latest
    container_name: arr411-egress
    restart: unless-stopped
    command: ["node", "server/egress.js"]
    environment:
      C411_ALLOWED_HOSTS: ${C411_ALLOWED_HOSTS:-}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

  # Client VPN (image tierce qmcgaw/gluetun, dont « latest » suit la branche principale : garde-la à jour, ou fige une
  # étiquette de version). C'est le seul conteneur du projet qui garde une capacité (NET_ADMIN, avec /dev/net/tun) et qui
  # porte un secret (ta clé VPN) ; gluetun écrit dans son système de fichiers, il n'est donc pas en lecture seule.
  # Son pare-feu coupe tout ce qui ne passe pas par le tunnel : si le VPN tombe, rien ne sort.
  # Aucun port publié ni FIREWALL_INPUT_PORTS : le navigateur joint le proxy (port 3128) par le réseau c411-egress, que son pare-feu accepte déjà.
  # Pas de FIREWALL_OUTBOUND_SUBNETS non plus : aucun sous-réseau supplémentaire n'est ouvert hors du tunnel.
  # Le serveur de contrôle de gluetun reste sur 127.0.0.1 : il n'est ni publié ni joignable depuis arr411.
  # Le contrôle de santé est celui de l'image, avec un délai de démarrage plus long : egress et browser ne démarrent qu'une fois le VPN monté.
  # Un autre gluetun tourne déjà sur la même machine ? Celui-ci a son propre nom de conteneur (arr411-gluetun) ;
  # selon le fournisseur, il lui faut aussi sa propre clé.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: arr411-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?renseigne VPN_SERVICE_PROVIDER dans .env (voir .env.example)}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_IMPLEMENTATION: ${WIREGUARD_IMPLEMENTATION:-auto}
      WIREGUARD_GSO: ${WIREGUARD_GSO:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - gluetun-data:/gluetun
    networks:
      - default
      - c411-egress
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to arr411:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - arr411

volumes:
  arr411-data:
  caddy-data:
  caddy-config:
  gluetun-data:

# Réseaux sans accès à Internet. Le navigateur est le seul à toucher les deux :
# c411-control relie arr411 (qui le pilote) au navigateur ; c411-egress relie le navigateur à gluetun, où vit le proxy de sortie.
# Le navigateur n'a donc aucune route directe vers Internet. Le port DevTools (9223) n'est publié nulle part,
# mais les conteneurs de ces deux réseaux (arr411, gluetun et le proxy) peuvent l'atteindre.
networks:
  c411-control:
    internal: true
  c411-egress:
    internal: true
